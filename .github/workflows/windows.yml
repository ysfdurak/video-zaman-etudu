name: Derleme ve kontroller (Windows + tarayıcı)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      surum:
        description: 'Yayınlanacak sürüm etiketi (ör. v1.2.0). Boş bırakılırsa yalnız derlenir.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Windows masaüstü
    runs-on: windows-latest
    permissions:
      contents: write   # yalnız v* etiketinde sürüm (Release) oluşturmak için
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: WPF uygulamasını derle
        run: dotnet build Desktop/Desktop.csproj -c Release
      - name: Hesaplama, etüt aktarımı ve eşdeğerlik kontrollerini çalıştır
        run: dotnet run --project Checks/Checks.csproj -c Release -- demo/sentetik-depo-etudu.vzetud Shared/esdeger-ornekler.json
      - name: Arayüz öz-denemesi (iki dil, demo etüdü, ekran görüntüleri)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse Desktop/bin/Release -Filter Desktop.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'oz-deneme'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', (Resolve-Path demo), $out -PassThru -Wait -NoNewWindow
          if (Test-Path (Join-Path $out 'oz-deneme.txt')) { Get-Content (Join-Path $out 'oz-deneme.txt') -Encoding utf8 }
          # Ekran görüntüleri günlüğe de yazılır (yapıt indirilemeyen ortamlarda incelemek için; base64, 76 karakterlik satırlar).
          Get-ChildItem $out -Filter *.png | ForEach-Object {
            "=== PNG $($_.Name) ==="
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName), 'InsertLineBreaks')
            "=== SON ==="
          }
          if ($p.ExitCode -ne 0) { throw "Öz-deneme başarısız ($($p.ExitCode))." }
      - name: Öz-deneme çıktısını yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VideoZamanEtudu_OzDeneme
          path: ${{ runner.temp }}/oz-deneme
          if-no-files-found: ignore
      - name: Windows x64 taşınabilir paketi oluştur
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'VideoZamanEtudu'
          dotnet publish Desktop/Desktop.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path (Join-Path $publish 'Desktop.exe') -PathType Leaf)) {
            throw 'Desktop.exe bulunamadı.'
          }
          # Güvenlik kapısı: paketteki gerçek SQLite sürümü CVE-2025-6965 düzeltmesini (3.50.2) içermeli.
          # Sürüm, e_sqlite3.dll içindeki sqlite3_version metninden okunur; eski ya da bulunamazsa paket üretilmez.
          $dll = Join-Path $publish 'e_sqlite3.dll'
          if (!(Test-Path $dll)) { throw 'e_sqlite3.dll pakette yok.' }
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          $m = [regex]::Matches($txt, '\x00(3\.\d{2}\.\d{1,2})\x00') | ForEach-Object { [version]$_.Groups[1].Value } | Sort-Object -Descending | Select-Object -First 1
          if (!$m) { throw 'Paketteki SQLite sürümü okunamadı.' }
          "Paketteki SQLite sürümü: $m"
          if ($m -lt [version]'3.50.2') { throw "SQLite $m, CVE-2025-6965 düzeltmesinden (3.50.2) eski." }
          Copy-Item demo (Join-Path $publish 'demo') -Recurse
          @'
          Desktop.exe dosyasını çalıştırın.
          Uygulama ayrı bir .NET kurulumu gerektirmez.
          Örnek etüt ve video demo klasöründedir.
          '@ | Set-Content -Encoding utf8 (Join-Path $publish 'BASLAT.txt')
          $zip = Join-Path $env:RUNNER_TEMP 'VideoZamanEtudu_Windows_x64.zip'
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip
      - name: İndirilebilir Windows ZIP’ini yükle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: VideoZamanEtudu_Windows_x64
          path: ${{ runner.temp }}/VideoZamanEtudu_Windows_x64.zip
          if-no-files-found: error
      - name: GitHub sürümünü yayınla (v* etiketi veya elle çalıştırmada sürüm girildiyse)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.surum, 'v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SURUM: ${{ inputs.surum }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Sürüm notu: RELEASE_NOTES.md'deki ilk "# v" bölümü
          $lines = Get-Content RELEASE_NOTES.md -Encoding utf8
          $next = ($lines | Select-String -Pattern '^# v' | Select-Object -Skip 1 -First 1).LineNumber
          $last = if ($next) { $next - 2 } else { $lines.Count - 1 }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          $lines[1..$last] | Set-Content -Encoding utf8 $notesFile
          $title = $lines[0].TrimStart('#', ' ')
          $zip = Join-Path $env:RUNNER_TEMP 'VideoZamanEtudu_Windows_x64.zip'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # Etiket yoksa bu derlemenin commit'inde oluşturulur.
            gh release create $env:SURUM $zip --title $title --notes-file $notesFile --target $env:GITHUB_SHA
          } else {
            gh release create $env:GITHUB_REF_NAME $zip --title $title --notes-file $notesFile --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  web:
    name: Tarayıcı sürümü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Çekirdek ve eşdeğerlik testleri (Shared/esdeger-ornekler.json)
        working-directory: Web
        run: npm test
      - name: Uçtan uca tarayıcı testi (Chrome, demo videosuyla)
        run: |
          pip install --quiet playwright==1.*
          (cd Web && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          CHROME="$(which google-chrome)" python3 Web/tests/e2e_chrome.py
      - name: Yayınlanacak statik dosyaları hazırla
        if: github.event_name != 'pull_request'
        run: |
          set -e
          out="$RUNNER_TEMP/site"
          mkdir -p "$out"
          cp -r Web/index.html Web/404.html Web/app.css Web/_headers Web/js Web/demo "$out/"
          test -f "$out/index.html" && test -f "$out/js/app.js"
      - name: Siteye konulacak web paketini yükle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: VideoZamanEtudu_Web
          path: ${{ runner.temp }}/site
          if-no-files-found: error
